<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barakah Mart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#17202a}
header{background:#0f5132;color:white;padding:14px 5%;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800}.search{flex:1;max-width:600px;padding:12px 16px;border:0;border-radius:8px;font-size:15px}
.cart{background:white;color:#0f5132;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}
.hero{padding:55px 5%;background:linear-gradient(135deg,#dff5e9,#fff);display:flex;justify-content:space-between;align-items:center;gap:25px}
.hero h1{font-size:44px;margin:0 0 12px}.hero p{font-size:18px;color:#52615a}.btn{background:#0f5132;color:#fff;border:0;padding:13px 20px;border-radius:8px;font-weight:700;cursor:pointer}
section{padding:30px 5%}.cats,.products{display:grid;gap:16px}.cats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.cat{background:#fff;padding:20px;text-align:center;border-radius:12px;box-shadow:0 2px 10px #0000000b}
.products{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #00000012}.pic{height:160px;background:#e8eee9;display:grid;place-items:center;font-size:55px}.info{padding:14px}.price{font-size:19px;font-weight:800;margin:8px 0}.add{width:100%;padding:10px;border:0;background:#0f5132;color:#fff;border-radius:7px;cursor:pointer}
footer{padding:25px 5%;background:#123b29;color:#fff;margin-top:25px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10}.box{background:white;width:min(520px,92%);margin:7vh auto;padding:24px;border-radius:14px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.pay label{display:block;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
@media(max-width:650px){header{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero h1{font-size:34px}}
</style>
</head>
<body>
<header>
<div class="logo">🛍️ Barakah Mart</div>
<input id="search" class="search" placeholder="পণ্য খুঁজুন..." oninput="render()">
<button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<div class="hero">
<div><h1>Barakah Mart</h1><p>এক জায়গায় সব ধরনের পণ্য। সহজে অর্ডার করুন, ঘরে পেয়ে যান।</p><button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button></div>
<div style="font-size:100px">🛒</div>
</div>

<section>
<h2>Categories</h2>
<div class="cats">
<div class="cat">👕<br>Fashion</div><div class="cat">📱<br>Electronics</div><div class="cat">💄<br>Beauty</div><div class="cat">🏠<br>Home</div><div class="cat">🛒<br>Grocery</div><div class="cat">👟<br>Shoes</div>
</div>
</section>

<section id="products"><h2>Featured Products</h2><div class="products" id="grid"></div></section>

<footer>
<strong>Barakah Mart</strong><br><br>
Cash on Delivery • bKash • Nagad<br>
© 2026 Barakah Mart
</footer>

<div id="modal" class="modal"><div class="box">
<h2>🛒 Your Cart</h2><div id="cartItems"></div>
<div class="row"><strong>Total</strong><strong id="total">৳0</strong></div>
<h3>Payment Method</h3>
<div class="pay">
<label><input type="radio" name="pay" value="cod" checked> Cash on Delivery</label>
<label><input type="radio" name="pay" value="bkash"> bKash</label>
<label><input type="radio" name="pay" value="nagad"> Nagad</label>
</div>
<button class="btn" onclick="checkout()">Place Order</button>
<button class="btn" style="background:#777" onclick="closeCart()">Close</button>
</div></div>

<script>
const products=[
{id:1,n:"Premium T-Shirt",p:650,e:"👕"}, {id:2,n:"Wireless Earbuds",p:1250,e:"🎧"},
{id:3,n:"Smart Watch",p:2200,e:"⌚"}, {id:4,n:"Ladies Handbag",p:1450,e:"👜"},
{id:5,n:"Running Shoes",p:1800,e:"👟"}, {id:6,n:"Kitchen Set",p:950,e:"🍳"},
{id:7,n:"Face Care Set",p:780,e:"💄"}, {id:8,n:"Grocery Pack",p:1200,e:"🛒"}
];
let cart=[];
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 document.getElementById('grid').innerHTML=products.filter(x=>x.n.toLowerCase().includes(q)).map(x=>`
 <div class="card"><div class="pic">${x.e}</div><div class="info"><b>${x.n}</b><div class="price">৳${x.p.toLocaleString()}</div><button class="add" onclick="add(${x.id})">Add to Cart</button></div></div>`).join('');
}
function add(id){let x=cart.find(a=>a.id===id);x?x.q++:cart.push({...products.find(a=>a.id===id),q:1});update()}
function update(){document.getElementById('count').textContent=cart.reduce((a,x)=>a+x.q,0)}
function openCart(){renderCart();document.getElementById('modal').style.display='block'}
function closeCart(){document.getElementById('modal').style.display='none'}
function renderCart(){
let total=cart.reduce((a,x)=>a+x.p*x.q,0);
document.getElementById('cartItems').innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${x.n} × ${x.q}</span><span>৳${(x.p*x.q).toLocaleString()}</span></div>`).join(''):'<p>Cart is empty.</p>';
document.getElementById('total').textContent='৳'+total.toLocaleString()
}
function checkout(){
if(!cart.length)return alert('আপনার cart খালি।');
let method=document.querySelector('input[name=pay]:checked').value;
alert('Order received! Payment: '+method.toUpperCase()+'\\nএটি demo version—real payment gateway এখনো সংযুক্ত হয়নি।');
cart=[];update();closeCart();
}
render();update();
</script>
</body>
</html>
